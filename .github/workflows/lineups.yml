name: Team lineups and logo regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check modules
        run: |
          for file in engine/*.js ui/*.js data/*.js; do node --check "$file"; done
      - name: Test role and hero allocation
        run: node tests/lineup-engine.cjs
      - name: Install test DOM
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Test both-team editor, stale seasons and logos
        run: node tests/lineup-browser.cjs
