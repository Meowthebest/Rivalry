name: Rivalry Integration Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Check Modules and UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          for file in *.js data/*.js engine/*.js; do node --check "$file"; done
      - name: Install test DOM
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Test spectator app
        run: node tests/smoke.cjs
